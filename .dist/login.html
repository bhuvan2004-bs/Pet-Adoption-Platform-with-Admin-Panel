<!DOCTYPE html>
<html ng-app="loginApp">
<head>
    <title>Pet Adoption - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="js/login.js"></script>
</head>
<body ng-controller="LoginController">
    <div class="login-container">
        <h1>Pet Adoption Login</h1>
        <form ng-submit="login()">
            <div class="form-group">
                <label>Username</label>
                <input type="text" ng-model="credentials.username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" ng-model="credentials.password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <p class="error-message" ng-if="error">{{error}}</p>
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </form>
    </div>
</body>
</html>
